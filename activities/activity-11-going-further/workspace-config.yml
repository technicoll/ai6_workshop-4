# Azure ML Workspace Configuration
# This workspace uses the secure storage infrastructure from Activities 1-10

$schema: https://azuremlschemas.azureedge.net/latest/workspace.schema.json
name: mlw-workshop
location: eastus  # Replace with your $LOCATION value
display_name: Secure ML Workshop
description: ML workspace using secure landing zone storage from Workshop Activities 1-10

# Reference the secure storage account created by main_secure_complete.bicep
# Replace <SUBSCRIPTION_ID>, <RESOURCE_GROUP>, and <STORAGE_ACCOUNT_NAME> with your values
storage_account: /subscriptions/<SUBSCRIPTION_ID>/resourceGroups/<RESOURCE_GROUP>/providers/Microsoft.Storage/storageAccounts/<STORAGE_ACCOUNT_NAME>

# Optional: Specify other resources if you want to reuse existing ones
# container_registry: /subscriptions/<SUBSCRIPTION_ID>/resourceGroups/<RESOURCE_GROUP>/providers/Microsoft.ContainerRegistry/registries/<REGISTRY_NAME>
# key_vault: /subscriptions/<SUBSCRIPTION_ID>/resourceGroups/<RESOURCE_GROUP>/providers/Microsoft.KeyVault/vaults/<KEY_VAULT_NAME>
# application_insights: /subscriptions/<SUBSCRIPTION_ID>/resourceGroups/<RESOURCE_GROUP>/providers/Microsoft.insights/components/<APP_INSIGHTS_NAME>

tags:
  environment: workshop
  purpose: activity-11-ml-pipeline
  createdBy: workshop-participant
  managedBy: azure-ml
